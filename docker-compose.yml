version: "3.9"

services:
  ord-ai:
    build: .
    container_name: ord-ai-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persistent SQLite databases survive container restarts
      - ord_ai_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - ORD_AI_DATA_DIR=/data
      # Add your LLM backend keys here (all optional — mock works without them)
      # - OPENAI_API_KEY=sk-...
      # - LMSTUDIO_URL=http://localhost:1234
      # - OLLAMA_URL=http://localhost:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/state"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ord_ai_data:
    driver: local
