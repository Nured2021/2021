# ORD AI — Human-in-the-Loop Policy Configuration
hitl:
  lanes:
    HITL_REQUIRED:
      description: "Core system files — human must approve"
      paths: ["src/core/**", "src/kernel/**", "agents/core/**"]
      timeout_h: 72
    HITL_OPTIONAL:
      description: "Tools and docs — auto unless flagged"
      paths: ["src/tools/**", "docs/**", "agents/tools/**"]
      timeout_h: 24
    HITL_NONE:
      description: "Tests and scripts — fully autonomous"
      paths: ["tests/**", "scripts/**", "static/**"]

cost_controls:
  daily_budget: 50.0
  max_tokens_per_task: 4096
  alert_threshold: 0.8
  hard_stop_at_budget: true

agents:
  planner:
    max_retries: 3
    temperature: 0.2
  implementer:
    max_retries: 5
    temperature: 0.1
  validator:
    max_retries: 3
    temperature: 0.0
  reviewer:
    max_retries: 2
    temperature: 0.0
  merger:
    max_retries: 2
    temperature: 0.0
