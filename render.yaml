services:
  - type: web
    name: ord-ai-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "5000"
    disk:
      name: ord-ai-data
      mountPath: /tmp
      sizeGB: 1
